<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Atlas — complete UI/UX review prototype</title>
<style>
:root{--bg:#f5f3ed;--panel:#fffdf8;--panel2:#ebe9e0;--ink:#252a24;--muted:#73786e;--line:#deddd3;--accent:#9f3e1f;--accent2:#f4e1d8;--warm:#c66d42;--accent-ink:#fffaf6;--shadow:none}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--panel)}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--warm);outline-offset:2px}input,textarea,select{border:1px solid var(--line);border-radius:9px;padding:11px;background:var(--panel);width:100%}textarea{min-height:100px;resize:vertical}a{color:var(--accent)}.app{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;overflow:auto;padding:21px 13px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:5px}.brand{font-size:27px;font-weight:900;letter-spacing:-.08em;padding:2px 10px 22px}.brand span{color:var(--warm)}.navlabel{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:800;padding:15px 11px 5px}.nav{border:0;text-align:left;background:transparent;padding:10px 12px;display:flex;gap:10px;align-items:center}.nav .glyph{width:20px;text-align:center;color:var(--muted)}.nav.active{background:var(--accent2);color:var(--accent);font-weight:750}.nav.active .glyph{color:var(--accent)}.sidebottom{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}.main{min-width:0}.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 clamp(16px,3vw,36px);border-bottom:1px solid var(--line);background:var(--bg)}.crumb{font-size:12px;color:var(--muted)}.topactions{display:flex;gap:8px;align-items:center}.avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--accent2);color:var(--accent);font-weight:800}.content{padding:clamp(18px,3vw,36px);max-width:1500px;margin:auto}.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:850;color:var(--muted)}h1{font-size:clamp(30px,4vw,47px);letter-spacing:-.065em;line-height:1.03;margin:8px 0 12px}h2{font-size:23px;letter-spacing:-.045em;margin:0 0 8px}h3{font-size:16px;letter-spacing:-.025em;margin:0 0 7px}p{margin:7px 0}.muted{color:var(--muted)}.subhead{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:26px 0 13px}.subhead h2{margin:0}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.grid{display:grid;gap:14px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;min-width:0;box-shadow:var(--shadow)}.soft{background:var(--panel2)}.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:5px 9px;background:var(--panel2);font-size:11px;color:var(--muted)}.pill.green{background:var(--accent2);color:var(--accent)}.searchbar{display:flex;gap:9px;align-items:center;max-width:720px}.searchbar input{padding:14px}.metric{font-size:29px;font-weight:850;letter-spacing:-.06em}.cover{min-height:130px;border-radius:10px;padding:14px;display:flex;align-items:end;font-weight:850;font-size:20px;letter-spacing:-.05em;background:var(--c,var(--panel2));color:var(--coverink,var(--ink))}.cover small{font-size:10px;letter-spacing:.12em;display:block;opacity:.8}.resource-card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:10px;min-width:0}.resource-card h3{font-size:14px;margin:9px 0 5px}.resource-card p{font-size:12px;color:var(--muted)}.masonry{columns:4 190px;column-gap:13px}.masonry .resource-card{break-inside:avoid;margin-bottom:13px}.resource-card button{margin-top:8px}.line{height:1px;background:var(--line);margin:14px 0}.empty{padding:38px 20px;text-align:center;border:1px dashed var(--line);border-radius:14px}.empty .symbol{font-size:34px;color:var(--accent);margin-bottom:8px}.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(250px,.7fr);gap:15px}.listrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}.mini-cover{width:54px;height:56px;flex-shrink:0;border-radius:7px;background:var(--c,var(--panel2));display:grid;place-items:center;font-weight:850}.badge{font-size:10px;border:1px solid var(--line);padding:4px 7px;border-radius:6px;color:var(--muted)}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0}.tabs button.active{background:var(--accent2);border-color:var(--accent2);color:var(--accent);font-weight:750}.board{height:480px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;background-color:var(--panel);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}.boardnode{position:absolute;width:175px;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);cursor:pointer}.boardnode b{display:block;margin:7px 0}.boardnode small{font-size:10px;color:var(--muted)}.boardnode:nth-of-type(1){left:5%;top:9%}.boardnode:nth-of-type(2){left:40%;top:24%;background:var(--accent2)}.boardnode:nth-of-type(3){left:17%;top:63%}.boardnode:nth-of-type(4){right:5%;top:60%}.board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.graphview{display:grid;place-items:center;min-height:440px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}.graphview svg{width:100%;height:430px}.graphnode{cursor:pointer}.reader{font:18px/1.9 Georgia,serif;max-width:720px}.reader mark{background:#f0d58c;color:#272820}.quote{border-left:3px solid var(--accent);padding:12px 15px;background:var(--accent2);border-radius:0 8px 8px 0}.progress{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent);width:64%}.step{display:flex;gap:12px;padding:12px 0}.stepnum{width:28px;height:28px;display:grid;place-items:center;background:var(--accent2);color:var(--accent);border-radius:50%;font-weight:800;flex-shrink:0}.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:10;max-width:min(90vw,400px)}.mobile-menu{display:none}
@media(max-width:1000px){.app{grid-template-columns:200px minmax(0,1fr)}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.masonry{columns:3 175px}}
@media(max-width:700px){.app{display:block}.sidebar{display:none;position:fixed;z-index:20;inset:0 auto 0 0;width:270px;height:100dvh;box-shadow:var(--shadow)}.sidebar.open{display:flex}.mobile-menu{display:inline-block}.topbar{height:60px;padding:0 13px}.content{padding:18px 13px}.grid2,.grid3,.grid4,.split{grid-template-columns:1fr}.masonry{columns:2 135px}.cover{min-height:105px;font-size:16px}.board{height:560px}.boardnode{width:145px;padding:10px;font-size:12px}.boardnode:nth-of-type(1){left:3%;top:8%}.boardnode:nth-of-type(2){left:49%;top:24%}.boardnode:nth-of-type(3){left:3%;top:61%}.boardnode:nth-of-type(4){right:2%;top:68%}.topactions .hide-mobile{display:none}.subhead{align-items:start;flex-direction:column}.searchbar{width:100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style></head><body><div class="app" id="app" data-theme="light"><aside class="sidebar" id="sidebar"><div class="brand">atlas<span>.</span></div><div class="navlabel">Your knowledge</div><button class="nav active" data-route="home"><span class="glyph">⌂</span>Home</button><button class="nav" data-route="library"><span class="glyph">▦</span>Library</button><button class="nav" data-route="search"><span class="glyph">⌕</span>Search</button><button class="nav" data-route="collections"><span class="glyph">▤</span>Collections</button><button class="nav" data-route="boards"><span class="glyph">⌘</span>Boards</button><button class="nav" data-route="graph"><span class="glyph">◎</span>Knowledge graph</button><div class="navlabel">Make sense</div><button class="nav" data-route="research"><span class="glyph">✳</span>Research studio</button><button class="nav" data-route="insights"><span class="glyph">↗</span>Insights & learning</button><div class="navlabel">Capture & manage</div><button class="nav" data-route="inbox"><span class="glyph">↧</span>Inbox <span class="pill">3</span></button><button class="nav" data-route="capture"><span class="glyph">＋</span>Quick capture</button><button class="nav" data-route="integrations"><span class="glyph">⌁</span>Integrations</button><div class="sidebottom"><button class="nav" data-route="settings"><span class="glyph">⚙</span>Settings & privacy</button><button class="nav" data-route="help"><span class="glyph">?</span>Help & recovery</button><div class="row" style="padding:10px"><div class="avatar">Y</div><div><b>Personal library</b><div class="muted" style="font-size:11px">Private workspace</div></div></div></div></aside><section class="main"><header class="topbar"><div class="row"><button class="mobile-menu" id="menu" aria-label="Open navigation">☰</button><div class="crumb" id="crumb">Your space / Home</div></div><div class="topactions"><button class="hide-mobile" id="globalSearch">⌕ Search anything</button><button class="hide-mobile" id="screenIndex">▦ All screens</button><button id="themeBtn" aria-label="Toggle light and dark mode">◐</button><button class="btn-primary" id="topCapture">＋ Capture</button><div class="avatar">Y</div></div></header><main class="content" id="screen" tabindex="-1"></main></section></div><div id="toast" class="toast" role="status" hidden></div>
<script>
const R=[
{id:1,title:"Designing for how people remember",kind:"ARTICLE",source:"UX Research",desc:"Recognition cues, context, and retrieval from partial memory.",color:"#e7c17f",icon:"↗",group:"Research"},
{id:2,title:"The shape of a second brain",kind:"ESSAY",source:"Personal notes",desc:"Ideas become useful when reused in new contexts.",color:"#cfdfcf",icon:"✳",group:"Thinking"},
{id:3,title:"Building reliable AI features",kind:"GITHUB",source:"Engineering handbook",desc:"Evaluation, traceability, failure handling, and honest boundaries.",color:"#d4e1ea",icon:"⌘",group:"Engineering"},
{id:4,title:"A map of distributed systems",kind:"DIAGRAM",source:"Systems notebook",desc:"Queues, caches, consistency, and service boundaries.",color:"#dfc3b7",icon:"◇",group:"Engineering"},
{id:5,title:"HTTP from first principles",kind:"COURSE",source:"Backend curriculum",desc:"Requests, responses, headers, and the web\'s basic contract.",color:"#344b3b",icon:"▤",group:"Learning",light:true},
{id:6,title:"An agent experience library",kind:"NOTE",source:"Quick capture",desc:"Can agents reuse successful trajectories without blindly copying them?",color:"#e8dfae",icon:"✎",group:"Ideas"},
{id:7,title:"Designing trustworthy systems",kind:"PDF",source:"Research archive",desc:"How evidence, uncertainty, and provenance affect trust.",color:"#d5d5ed",icon:"▧",group:"Research"},
{id:8,title:"The art of useful constraints",kind:"VIDEO",source:"Saved video",desc:"A talk about reducing choices to improve decisions.",color:"#dfd2bd",icon:"▶",group:"Thinking"}
];
let route="home",theme="light",searchTerm="",activeResource=1,collectionTab="All items",boardMode="Freeform",graphMode="Local graph",inboxFilter="All",captureType="URL",researchStep=1;
const titles={screenindex:"All screens",home:"Home",library:"Library",search:"Search",collections:"Collections",boards:"Boards",graph:"Knowledge graph",research:"Research studio",insights:"Insights & learning",inbox:"Inbox",capture:"Quick capture",integrations:"Integrations",settings:"Settings & privacy",help:"Help & recovery",onboarding:"Welcome to Atlas",detail:"Resource detail",reader:"Focused reader",importing:"Import status",empty:"Empty state preview",error:"Failure & recovery",export:"Export & portability",bulk:"Bulk actions"};
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function toast(s){const t=document.querySelector("#toast");t.textContent=s;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,2600)}
function go(r){route=r;document.querySelector("#sidebar").classList.remove("open");render();document.querySelector("#screen").focus({preventScroll:true});}
function card(r){return '<article class="resource-card"><div class="cover" style="--c:'+r.color+';--coverink:'+(r.light?'#fffdf8':'var(--ink)')+'"><div><small>'+r.kind+' · ATLAS</small>'+r.icon+' '+esc(r.kind==='NOTE'?'Working idea':r.title.split(' ').slice(0,3).join(' '))+'</div></div><h3>'+esc(r.title)+'</h3><p>'+esc(r.source)+' · '+esc(r.desc)+'</p><div class="row wrap"><span class="pill">'+esc(r.group)+'</span><button data-detail="'+r.id+'">Open ↗</button></div></article>'}
function header(k,title,desc,actions=''){return '<div class="eyebrow">'+k+'</div><div class="row between wrap"><div class="grow"><h1>'+title+'</h1><p class="muted">'+desc+'</p></div><div class="row wrap">'+actions+'</div></div>'}
function resourcesGrid(arr=R){return '<div class="masonry">'+arr.map(card).join('')+'</div>'}
function detail(r){activeResource=r.id;go("detail")}
function renderScreenIndex(){const groups=[["Core library",["home","library","search","collections","detail","reader"]],["Thinking & synthesis",["boards","graph","research","insights"]],["Capture & account",["inbox","capture","importing","integrations","settings","export"]],["Onboarding & system states",["onboarding","empty","error","bulk","help"]]];return header("Review navigation","All screens & states","Jump directly to any screen in this connected concept prototype. These are primary screen families and representative system states, not a claim that every logical route is individually implemented.")+groups.map(g=>"<div class='subhead'><h2>"+g[0]+"</h2></div><div class='grid grid3'>"+g[1].map(k=>"<button class='card' data-route='"+k+"' style='text-align:left'><span class='eyebrow'>SCREEN / "+k.toUpperCase()+"</span><h3 style='margin-top:10px'>"+(titles[k]||k)+"</h3><p class='muted'>Open this screen for review →</p></button>").join("")+"</div>").join("")}
function renderHome(){return header("Your personal knowledge system","Good ideas find a way back.","Your library is a place to collect, connect, and return to what matters.",'<button data-route="capture" class="btn-primary">＋ Save a resource</button>')+'<div class="grid grid3" style="margin-top:24px"><article class="card soft"><div class="eyebrow">Library</div><div class="metric">126</div><p class="muted">Resources saved</p><button data-route="library">Explore library →</button></article><article class="card"><div class="eyebrow">Active thinking</div><div class="metric">4</div><p class="muted">Boards in progress</p><button data-route="boards">Return to a board →</button></article><article class="card"><div class="eyebrow">Research</div><div class="metric">2</div><p class="muted">Open investigations</p><button data-route="research">Continue research →</button></article></div><div class="subhead"><h2>Pick up where you left off</h2><button data-route="insights">View learning journey →</button></div><div class="grid grid3"><article class="card"><span class="pill green">Recently opened</span><h3 style="margin-top:12px">Designing for how people remember</h3><p class="muted">You highlighted a passage about context cues.</p><button data-detail="1">Continue reading →</button></article><article class="card"><span class="pill">Board updated</span><h3 style="margin-top:12px">Agent experience library</h3><p class="muted">4 cards · 3 relationships · one open question.</p><button data-route="boards">Open board →</button></article><article class="card"><span class="pill">Needs attention</span><h3 style="margin-top:12px">3 items in your inbox</h3><p class="muted">One import needs a quick fix.</p><button data-route="inbox">Review inbox →</button></article></div><div class="subhead"><h2>Rediscover something useful</h2><button data-route="library">All resources →</button></div>'+resourcesGrid(R.slice(0,4))}
function renderLibrary(){return header("Your collection","Library","One canonical resource, many ways to browse. Organize when it helps—not before.")+'<div class="toolbar row wrap" style="margin:20px 0"><div class="searchbar grow"><input id="libFilter" placeholder="Filter by title, source, topic…"><button id="clearFilter">Clear</button></div><select id="libraryView" style="width:auto"><option>Masonry view</option><option>Compact list</option></select><button data-route="bulk">Select items</button><button data-route="capture" class="btn-primary">＋ Capture</button></div><div class="tabs">'+["All items","Articles","Videos","Courses","Notes","GitHub","PDFs"].map(x=>'<button class="'+(collectionTab===x?'active':'')+'" data-libtab="'+x+'">'+x+'</button>').join('')+'</div><div class="row between"><span class="muted" id="libCount">8 resources · sorted by recently saved</span><button id="sortBtn">↕ Recently saved</button></div><div id="libResults" style="margin-top:14px">'+resourcesGrid(R)+'</div>'}
function renderSearch(){return header("Find the idea, not just the title","What do you remember?","Search across titles, notes, sources, and concepts. Semantic search is represented here as a proposed interaction; this prototype uses local text matching.")+'<div class="card" style="margin:22px 0"><div class="searchbar"><input id="mainSearch" value="'+esc(searchTerm)+'" placeholder="e.g. something about retrieval from partial memory"><button class="btn-primary" id="runSearch">Search</button></div><div class="row wrap" style="margin-top:12px"><span class="pill">⌕ Titles + notes</span><span class="pill">Source type</span><span class="pill">Saved date</span><span class="pill">Collection</span></div></div><div id="searchResults"><div class="eyebrow">Try a remembered fragment</div><div class="tabs">'+["context cues","AI reliability","distributed systems","agent experience"].map(q=>'<button data-query="'+q+'">'+q+'</button>').join('')+'</div><div class="subhead"><h2>Suggested starting points</h2></div>'+resourcesGrid(R.slice(0,4))+'</div>'}
function renderCollections(){const cols=[["Engineering notebook","18 resources","Backend, distributed systems, reliability","#d4e1ea"],["Research methods","12 resources","Questions, evidence, synthesis","#e7c17f"],["Ideas to revisit","9 resources","Unfinished thoughts worth returning to","#cfdfcf"],["AI engineering","24 resources","Agents, evaluation, tools, safety","#dfc3b7"]];return header("Organize by intent","Collections & shelves","Curated shelves for a purpose. A resource can belong to multiple collections without being duplicated.",'<button id="newCollection" class="btn-primary">＋ New collection</button>')+'<div class="tabs">'+["All shelves","Pinned","Recently updated"].map((x,i)=>'<button class="'+(i===0?'active':'')+'">'+x+'</button>').join('')+'</div><div class="grid grid2">'+cols.map((c,i)=>'<article class="card"><div class="cover" style="--c:'+c[3]+';min-height:150px"><div><small>COLLECTION / 0'+(i+1)+'</small>'+c[0]+'</div></div><div class="row between" style="margin-top:12px"><div><h3>'+c[0]+'</h3><p class="muted">'+c[2]+'</p><span class="pill">'+c[1]+'</span></div><button data-open-collection="'+i+'">Open shelf →</button></div></article>').join('')+'</div><div class="subhead"><h2>Recent collection activity</h2></div><div class="card">'+R.slice(0,3).map(r=>'<div class="listrow"><div class="mini-cover" style="--c:'+r.color+'">'+r.icon+'</div><div class="grow"><b>'+r.title+'</b><div class="muted">'+r.source+'</div></div><button data-detail="'+r.id+'">Open</button></div>').join('')+'</div>'}
function renderBoards(){return header("Think with your resources","Boards","Spatial workspaces for making connections, not just storing cards.",'<button id="newBoard" class="btn-primary">＋ New board</button>')+'<div class="tabs">'+["Freeform","Guided canvas","Board list"].map(x=>'<button class="'+(boardMode===x?'active':'')+'" data-boardmode="'+x+'">'+x+'</button>').join('')+'</div>'+(boardMode==="Board list"?'<div class="grid grid2">'+["Agent experience library","Distributed systems map","Life OS","AI engineering roadmap"].map((x,i)=>'<article class="card"><div class="eyebrow">BOARD / 0'+(i+1)+'</div><h3 style="margin-top:10px">'+x+'</h3><p class="muted">Last updated recently · private</p><button data-boardmode="Freeform">Open canvas →</button></article>').join('')+'</div>':'<div class="card"><div class="row between wrap"><div><h3>Agent experience library</h3><p class="muted">Explore how successful agent trajectories could become reusable knowledge.</p></div><div class="row wrap"><button id="addBoardCard">＋ Add card</button><button id="connectBoard">↗ Connect mode</button><button id="boardHelp">Keyboard help</button></div></div><div class="board" id="board"><svg viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true"><line x1="170" y1="95" x2="500" y2="180" stroke="var(--accent)" stroke-width="2"/><line x1="500" y1="180" x2="280" y2="370" stroke="var(--accent)" stroke-width="2"/><line x1="500" y1="180" x2="820" y2="350" stroke="var(--accent)" stroke-width="2"/></svg><article class="boardnode" tabindex="0"><small>QUESTION</small><b>What makes an agent trajectory reusable?</b><span class="muted">Working question</span></article><article class="boardnode" tabindex="0"><small>RESOURCE</small><b>Experience replay</b><span class="muted">Source · article</span></article><article class="boardnode" tabindex="0"><small>NOTE</small><b>Context matters</b><span class="muted">Do not copy blindly</span></article><article class="boardnode" tabindex="0"><small>OPEN QUESTION</small><b>How do we evaluate transfer?</b><span class="muted">Needs evidence</span></article></div><div class="row between wrap" style="margin-top:10px"><span class="muted" id="boardStatus">4 cards · 3 relationships · local prototype</span><button data-route="library">Browse resource cards</button></div></div>')}
function renderGraph(){return header("Connections between ideas","Knowledge graph","Explore local connections first. Every relationship should explain whether it was made by you, inferred, or confirmed.")+'<div class="tabs">'+["Local graph","Full graph","Backlinks"].map(x=>'<button class="'+(graphMode===x?'active':'')+'" data-graphmode="'+x+'">'+x+'</button>').join('')+'</div><div class="split"><div class="graphview"><svg viewBox="0 0 700 440" role="img" aria-label="Illustrative concept graph"><g stroke="var(--line)" stroke-width="2"><line x1="350" y1="210" x2="160" y2="100"/><line x1="350" y1="210" x2="545" y2="95"/><line x1="350" y1="210" x2="155" y2="340"/><line x1="350" y1="210" x2="545" y2="340"/><line x1="160" y1="100" x2="545" y2="95"/></g>'+[[350,210,"Partial memory","var(--accent2)"],[160,100,"Context cues","var(--panel2)"],[545,95,"Search design","var(--panel2)"],[155,340,"Personal library","var(--panel2)"],[545,340,"AI retrieval","var(--panel2)"]].map((n,i)=>'<g class="graphnode" tabindex="0" data-graphnode="'+i+'"><circle cx="'+n[0]+'" cy="'+n[1]+'" r="'+(i===0?65:49)+'" fill="'+n[3]+'" stroke="var(--line)" stroke-width="2"/><text x="'+n[0]+'" y="'+(n[1]-3)+'" text-anchor="middle" fill="var(--ink)" font-size="13" font-weight="700">'+n[2].split(' ').slice(0,2).join(' ')+'</text><text x="'+n[0]+'" y="'+(n[1]+15)+'" text-anchor="middle" fill="var(--muted)" font-size="10">'+(i===0?'3 connections':'resource')+'</text></g>').join('')+'</svg></div><aside class="card"><div class="eyebrow">Selected concept</div><h2 id="graphTitle" style="margin-top:10px">Partial memory</h2><p class="muted" id="graphDesc">Central concept with three neighboring ideas.</p><div class="line"></div><h3>Relationships</h3><div class="listrow"><span class="pill green">User-created</span><span class="grow">helps retrieve</span></div><div class="listrow"><span class="pill">AI-suggested</span><span class="grow">may relate to</span></div><p class="muted" style="font-size:12px">Suggested edges function renderResearch(){return header("Question → sources → claims → synthesis","Research studio","Build a defensible answer with traceable evidence, disagreement, and uncertainty.",'<button id="newResearch" class="btn-primary">＋ New investigation</button>')+'<div class="card soft"><div class="eyebrow">Current investigation / 07</div><h2 style="margin-top:8px">How can a knowledge system retrieve ideas from partial memory?</h2><div class="row wrap"><span class="pill">3 sources</span><span class="pill">2 working claims</span><span class="pill">1 open question</span><span class="pill">Draft</span></div></div><div class="tabs">'+["Question","Sources","Evidence","Synthesis"].map((x,i)=>'<button class="'+(researchStep===i+1?'active':'')+'" data-rstep="'+(i+1)+'">'+String(i+1).padStart(2,"0")+' / '+x+'</button>').join('')+'</div><div id="researchPane">'+researchPane()+'</div>'}
function researchPane(){if(researchStep===1)return '<div class="grid grid2"><div class="card"><h3>Frame the question</h3><label class="muted">Research question</label><textarea id="questionText">How can a personal knowledge system retrieve an idea when the user only remembers its context?</textarea><label class="muted">What would count as a useful answer?</label><textarea>Compare retrieval strategies, note limitations, and identify what needs testing.</textarea><button class="btn-primary" id="saveQuestion">Save question</button></div><div class="card"><h3>Investigation plan</h3>'+["Define user and recall context","Collect primary and secondary sources","Extract claims with source passages","Compare support and contradictions","Draft synthesis with limitations"].map((x,i)=>'<div class="step"><div class="stepnum">'+(i+1)+'</div><div>'+x+'</div></div>').join('')+'</div></div>';if(researchStep===2)return '<div class="split"><div class="card">'+R.slice(0,4).map(r=>'<div class="listrow"><div class="mini-cover" style="--c:'+r.color+'">'+r.icon+'</div><div class="grow"><b>'+r.title+'</b><div class="muted">'+r.source+' · '+r.kind+'</div></div><button data-detail="'+r.id+'">Inspect</button></div>').join('')+'</div><div class="card"><h3>Source integrity</h3><p class="muted">Distinguish source metadata from verified contents. Imported or AI-extracted claims need a path back to the original passage.</p><button id="addResearchSource">＋ Add source</button></div></div>';if(researchStep===3)return '<div class="grid grid2"><article class="card"><span class="pill green">Working claim A</span><h3 style="margin-top:10px">Context cues may support retrieval when exact wording is forgotten.</h3><p class="muted">Support: Designing for how people remember · passage needs verification.</p><button id="inspectClaim">Inspect evidence</button></article><article class="card"><span class="pill">Counterpoint needed</span><h3 style="margin-top:10px">Visual browsing may not scale for text-heavy libraries.</h3><p class="muted">Status: unresolved. Seek counterevidence and compare task outcomes.</p><button id="counterEvidence">Find counterevidence</button></article></div>';return '<div class="card"><div class="eyebrow">Synthesis draft</div><h2 style="margin-top:10px">Retrieval should combine context and explicit query tools.</h2><p class="reader">A useful system can provide multiple entry points: recognition through visual context, recall through search fragments, and structured filters for narrowing results. The best approach should be evaluated against real retrieval tasks and must explain what it matched.</p><div class="quote">Limitations: these are prototype hypotheses, not verified research findings. Attach source passages before treating any claim as evidence.</div><div class="row wrap" style="margin-top:15px"><button id="exportSynthesis">Export draft</button><button id="markReview">Mark ready for review</button></div></div>'}
function renderInsights(){return header("Progress that serves your goals","Insights & learning","Reflect on what you capture, revisit, connect, and apply. No streak pressure by default.")+'<div class="grid grid3"><article class="card"><div class="eyebrow">Revisited this month</div><div class="metric">18</div><p class="muted">Resources returned to</p></article><article class="card"><div class="eyebrow">Ideas connected</div><div class="metric">11</div><p class="muted">Connections you reviewed</p></article><article class="card"><div class="eyebrow">Synthesis artifacts</div><div class="metric">4</div><p class="muted">Drafts and notes created</p></article></div><div class="grid grid2" style="margin-top:15px"><article class="card"><h2>Learning journey</h2><p class="muted">A gentle view of what you\'ve been exploring.</p>'+[["Backend fundamentals",76],["AI engineering",52],["Research methods",34],["Personal systems",62]].map(x=>'<div style="margin-top:15px"><div class="row between"><span>'+x[0]+'</span><span class="muted">'+x[1]+'%</span></div><div class="progress" style="margin-top:7px"><span style="width:'+x[1]+'%"></span></div></div>').join('')+'</article><article class="card"><h2>Reflection prompts</h2><p class="muted">Use insights to take a next step, not to chase activity.</p><div class="quote">Which idea did you actually apply this week?</div><div class="quote" style="margin-top:10px">What have you saved but not tested?</div><div class="row wrap" style="margin-top:15px"><button id="reflect">Write reflection</button><button id="gamify">Learning mechanics settings</button></div></article></div><div class="card" style="margin-top:15px"><div class="row between"><div><h3>Optional motivation mechanics</h3><p class="muted">Milestones, reminders, and streaks are opt-in and can be disabled.</p></div><span class="pill">Off by default</span></div><button data-route="settings">Configure preferences</button></div>'}
function renderInbox(){return header("Capture now, sort later","Inbox","A forgiving landing zone for new resources, failed imports, and unfinished captures.")+'<div class="tabs">'+["All","Needs attention","Ready","Failed"].map(x=>'<button class="'+(inboxFilter===x?'active':'')+'" data-inbox="'+x+'">'+x+'</button>').join('')+'</div><div class="card" id="inboxItems">'+[[R[5],"Ready","Saved from quick capture"],[R[6],"Needs attention","PDF text extraction needs review"],[R[7],"Failed","Source unavailable; original URL retained"]].filter(x=>inboxFilter==="All"||x[1]===inboxFilter).map(x=>'<div class="listrow"><div class="mini-cover" style="--c:'+x[0].color+'">'+x[0].icon+'</div><div class="grow"><b>'+x[0].title+'</b><div class="muted">'+x[2]+'</div><span class="pill">'+x[1]+'</span></div><button data-detail="'+x[0].id+'">Review</button></div>').join('')||'<div class="empty"><div class="symbol">✓</div><h3>Nothing in this view</h3><p class="muted">Try another filter.</p></div>'+'</div><div class="row wrap" style="margin-top:15px"><button data-route="capture" class="btn-primary">＋ Capture another</button><button data-route="importing">View import lifecycle</button><button data-route="error">Preview recovery states</button></div>'}
function renderCapture(){return header("Fast capture, no filing required","Save something useful","Capture a resource first. Atlas can help enrich and organize it later.")+'<div class="grid grid2"><div class="card"><div class="tabs">'+["URL","Note","File","Manual resource"].map(x=>'<button class="'+(captureType===x?'active':'')+'" data-capturetype="'+x+'">'+x+'</button>').join('')+'</div><form id="captureForm"><label class="muted" for="captureTitle">'+(captureType==="URL"?"Paste a URL":captureType==="Note"?"Give this note a title":captureType==="File"?"File name (demo only)":"Resource title")+'</label><input id="captureTitle" placeholder="'+(captureType==="URL"?"https://…":"A useful idea to return to")+'" required><label class="muted" for="captureNote" style="display:block;margin-top:13px">Context (optional)</label><textarea id="captureNote" placeholder="Why did you save this? What do you want to remember?"></textarea><div class="row wrap" style="margin-top:14px"><button type="submit" class="btn-primary">Save to inbox →</button><span class="muted" style="font-size:11px">Local prototype only</span></div></form></div><aside class="card soft"><h2>Capture philosophy</h2>'+["One-step capture before organization","Keep original URL and source details","Show processing status honestly","Never imply an import succeeded if it failed"].map((x,i)=>'<div class="step"><div class="stepnum">'+(i+1)+'</div><div>'+x+'</div></div>').join('')+'</aside></div>'}
function renderIntegrations(){return header("Bring your knowledge together","Capture sources & integrations","Connect sources deliberately. Show permissions, last sync, failures, and disconnect controls clearly.")+'<div class="grid grid3">'+[["Browser extension","Save pages while browsing","Not connected"],["Obsidian","Markdown vault import/export","Available as design target"],["YouTube","Save video links and transcripts","Not connected"],["GitHub","Repositories, issues, and docs","Not connected"],["Cloud storage","Import selected documents","Not connected"],["RSS & newsletters","Capture reading feeds","Planned"]].map((x,i)=>'<article class="card"><div class="avatar" style="border-radius:10px;width:45px;height:45px">'+["↗","◈","▶","⌘","▧","≋"][i]+'</div><h3 style="margin-top:14px">'+x[0]+'</h3><p class="muted">'+x[1]+'</p><div class="row between" style="margin-top:15px"><span class="pill">'+x[2]+'</span><button data-integration="'+x[0]+'">Details</button></div></article>').join('')+'</div><div class="card" style="margin-top:15px"><h3>Permission principle</h3><p class="muted">Least privilege, clear scopes, revocation, and honest disclosure of what is stored. This mock does not connect any external account.</p></div>'}
function renderSettings(){return header("Your data, your choices","Settings & privacy","Privacy, accessibility, portability, and recovery are core product features—not hidden afterthoughts.")+'<div class="grid grid2"><section class="card"><h2>Appearance & accessibility</h2><div class="listrow"><div class="grow"><b>Theme</b><div class="muted">Light or dark mode</div></div><button id="settingsTheme">Toggle theme</button></div><div class="listrow"><div class="grow"><b>Reduced motion</b><div class="muted">Respect system preference</div></div><span class="pill">System</span></div><div class="listrow"><div class="grow"><b>Compact density</b><div class="muted">Control how much you see at once</div></div><button id="density">Change</button></div></section><section class="card"><h2>Privacy & AI</h2><div class="listrow"><div class="grow"><b>AI processing</b><div class="muted">Review data sent for model processing</div></div><button id="aiPrivacy">Review</button></div><div class="listrow"><div class="grow"><b>Sharing defaults</b><div class="muted">Keep boards and collections private</div></div><span class="pill green">Private</span></div><div class="listrow"><div class="grow"><b>Retention</b><div class="muted">Control stored content and metadata</div></div><button id="retention">Review</button></div></section><section class="card"><h2>Portability & backup</h2><p class="muted">Export resources, annotations, collections, relationships, and provenance in a documented format.</p><button data-route="export" class="btn-primary">Export my library →</button></section><section class="card"><h2>Account & access</h2><p class="muted">Manage sign-in, sessions, recovery options, and account deletion.</p><button id="account">Account controls</button><button id="sessions" style="margin-left:6px">Active sessions</button></section></div>'}
function renderHelp(){return header("When something goes wrong","Help & recovery","Clear explanations, recoverable actions, and an export path you can understand.")+'<div class="grid grid2"><article class="card"><h2>Common recovery paths</h2>'+[["Import failed","Original URL or file name remains available; retry or dismiss."],["Resource missing","Check archive, deleted items, and source availability."],["Search returned nothing","Broaden the query, clear filters, or browse the library."],["Export interrupted","Retry the export and verify included content before leaving."]].map(x=>'<div class="listrow"><div class="grow"><b>'+x[0]+'</b><div class="muted">'+x[1]+'</div></div><button data-recovery="'+x[0]+'">View</button></div>').join('')+'</article><article class="card"><h2>Recovery should be explicit</h2><p class="muted">No silent data loss, no fake success states, no destructive action without a clear confirmation and undo where possible.</p><button data-route="error">Preview failure states</button><button data-route="export" style="margin-left:6px">Export options</button></article></div>'}
function renderOnboarding(){return '<div style="max-width:850px;margin:30px auto"><div class="eyebrow">Welcome / 01 of 04</div><h1>Your knowledge should work for you.</h1><p class="muted">Capture useful things, find them when you need them, and connect them into ideas you can reuse. Start simple; personalize the rest later.</p><div class="grid grid2" style="margin-top:25px">'+[["Collect","Save links, notes, files, videos, and repositories."],["Rediscover","Search by what you remember, not just exact titles."],["Connect","Use boards and graphs to develop relationships."],["Synthesize","Build research with evidence and source provenance."]].map((x,i)=>'<button class="card" data-onboard="'+i+'" style="text-align:left"><span class="pill">0'+(i+1)+'</span><h2 style="margin-top:12px">'+x[0]+'</h2><p class="muted">'+x[1]+'</p></button>').join('')+'</div><div class="row between" style="margin-top:22px"><span class="muted">Setup is skippable. You can change preferences later.</span><button class="btn-primary" data-route="home">Enter my library →</button></div></div>'}
function renderDetail(){const r=R.find(x=>x.id===activeResource)||R[0];return '<div class="row between wrap"><button data-route="library">← Back to library</button><div class="row wrap"><button id="favorite">☆ Save for later</button><button id="detailMore">••• More</button></div></div><div class="split" style="margin-top:20px"><article><div class="cover" style="--c:'+r.color+';min-height:220px"><div><small>'+r.kind+' / ORIGINAL SOURCE</small>'+r.title+'</div></div><div class="eyebrow" style="margin-top:22px">'+r.source+' · Saved recently</div><h1>'+r.title+'</h1><p class="muted">'+r.desc+'</p><div class="tabs"><button class="active">Overview</button><button data-route="reader">Read</button><button data-route="research">Use in research</button></div><div class="card"><h2>Why you saved it</h2><p>Context note: this resource may help answer a question you\'re exploring. Add your own note to preserve the reason it matters.</p><textarea id="resourceNote" placeholder="Add a personal annotation…"></textarea><button id="saveAnnotation" style="margin-top:8px">Save annotation</button></div><div class="subhead"><h2>Highlights & annotations</h2></div><div class="quote">“Context cues can support recognition when exact recall is difficult.”<div class="muted" style="font-size:11px;margin-top:6px">Illustrative excerpt · source verification required</div></div></article><aside><div class="card"><h3>Resource details</h3>'+[["Type",r.kind],["Source",r.source],["Collection",r.group],["Status","Saved"],["Provenance","Original reference retained"]].map(x=>'<div class="listrow"><span class="muted">'+x[0]+'</span><span class="grow" style="text-align:right">'+x[1]+'</span></div>').join('')+'<button data-route="export" style="margin-top:10px">Export this resource</button></div><div class="card" style="margin-top:14px"><h3>Connected ideas</h3><button data-route="graph">Explore in graph →</button><button data-route="boards" style="margin-left:5px">Open on board →</button></div></aside></div>'}
function renderReader(){const r=R.find(x=>x.id===activeResource)||R[0];return '<div class="row between wrap"><button data-route="detail">← Resource details</button><div class="row"><button id="readerFont">A− / A+</button><button id="readerFocus">Focus mode</button></div></div><div class="split" style="margin-top:22px"><article><div class="eyebrow">Focused reader · '+r.kind+'</div><h1>'+r.title+'</h1><p class="muted">'+r.source+' · Reading view</p><div class="progress" style="margin:20px 0"><span></span></div><div class="reader"><p>When people try to retrieve an idea, they may remember the context in which they encountered it rather than the title or exact wording.</p><p>That suggests a knowledge system should provide several retrieval paths: a visual cue, a remembered phrase, a source type, a topic, or a related concept.</p><p><mark>Any generated summary or claim should link back to its source passage.</mark> This is a design hypothesis for the prototype, not a verified quotation from the saved resource.</p><p>Good reading tools preserve the original source, allow private annotations, and make it easy to return to the surrounding context.</p></div></article><aside class="card"><h3>Reading tools</h3><button id="highlight">＋ Highlight selection</button><button id="readerNote" style="margin-left:5px">Add note</button><div class="line"></div><h3>On this page</h3><p class="muted">Overview · Retrieval cues · Provenance</p><div class="line"></div><h3>Saved annotations</h3><p class="muted" id="readerAnnotations">No personal annotations yet.</p></aside></div>'}
function renderImporting(){return header("Capture lifecycle","Import status","Each stage is visible. A failure must retain the original reference and offer recovery.")+'<div class="card" style="max-width:850px"><div class="row between"><div><h2>Designing for how people remember</h2><p class="muted">https://example.com/retrieval-cues</p></div><span class="pill green">Completed (demo)</span></div><div class="line"></div>'+[["Reference saved","Original URL and timestamp retained","Complete"],["Metadata extracted","Title, source, and content type","Complete"],["Content processed","Readable text available for indexing","Complete"],["Search index updated","Local demo only; no real index","Illustrative"]].map((x,i)=>'<div class="step"><div class="stepnum">'+(i+1)+'</div><div class="grow"><b>'+x[0]+'</b><div class="muted">'+x[1]+'</div></div><span class="pill">'+x[2]+'</span></div>').join('')+'<div class="row wrap"><button id="retryImport" class="btn-primary">Retry processing</button><button data-route="inbox">Back to inbox</button><button data-route="error">See failure state</button></div></div>'}
function renderEmpty(){return header("State previews","Empty, loading & no-results states","These are part of the design, not exceptions to handle later.")+'<div class="grid grid3"><div class="empty"><div class="symbol">▦</div><h3>Nothing here yet</h3><p class="muted">Save your first resource and it will appear in your library.</p><button data-route="capture">Capture first resource</button></div><div class="empty"><div class="symbol">⌕</div><h3>No results found</h3><p class="muted">Try fewer terms or remove a filter. Your resources are still safe.</p><button data-route="search">Broaden search</button></div><div class="empty"><div class="symbol">◌</div><h3>Loading state</h3><p class="muted">Show what is being loaded and preserve the user\'s context.</p><button id="loadingDemo">Preview loading</button></div></div>'}

function renderExport(){return header("Portability is a product feature","Export & leave safely","Make it possible to leave Atlas with your resources, notes, collections, relationships, and source provenance.")+'<div class="split"><section class="card"><h2>Choose what to export</h2>'+[["Resources and original references",true],["Annotations and highlights",true],["Collections and memberships",true],["Boards and spatial positions",true],["Graph relationships and provenance",true],["Research drafts and citations",true],["Account settings",false]].map((x,i)=>'<label class="listrow" style="cursor:pointer"><input type="checkbox" '+(x[1]?'checked':'')+' style="width:auto"><span class="grow">'+x[0]+'</span></label>').join('')+'<div class="line"></div><label class="muted">Format</label><select id="exportFormat"><option>Markdown + JSON manifest</option><option>JSON archive</option><option>CSV index</option></select><button id="startExport" class="btn-primary" style="margin-top:14px">Prepare export</button></section><aside class="card soft"><h2>Before you export</h2><p class="muted">Review included content, file size, permissions, and whether attachments are embedded or referenced.</p><div class="quote">Export integrity rule: do not report success until the archive is produced and its contents can be verified.</div><div class="line"></div><h3>Import into another tool</h3><p class="muted">Document field mappings, unsupported data, and round-trip limitations.</p></aside></div>'}
function renderBulk(){return header("Act on a group, safely","Bulk selection","Make selection state visible, provide a clear count, and preview destructive operations.")+'<div class="card"><div class="row between wrap"><h2>Choose resources</h2><span class="pill" id="bulkCount">0 selected</span></div>'+R.map(r=>'<label class="listrow"><input type="checkbox" data-bulk="'+r.id+'" style="width:auto"><div class="mini-cover" style="--c:'+r.color+'">'+r.icon+'</div><div class="grow"><b>'+r.title+'</b><div class="muted">'+r.source+'</div></div><span class="pill">'+r.kind+'</span></label>').join('')+'<div class="row wrap" style="margin-top:15px"><button id="bulkCollection">Add to collection</button><button id="bulkExport">Export selected</button><button id="bulkDelete">Delete selected…</button></div></div>'}
function render(){document.querySelector("#app").setAttribute("data-theme",theme);document.querySelector("#crumb").textContent="Your space / "+(titles[route]||route);document.querySelectorAll("[data-route]").forEach(b=>b.classList.toggle("active",b.dataset.route===route));let views={screenindex:renderScreenIndex,home:renderHome,library:renderLibrary,search:renderSearch,collections:renderCollections,boards:renderBoards,graph:renderGraph,research:renderResearch,insights:renderInsights,inbox:renderInbox,capture:renderCapture,integrations:renderIntegrations,settings:renderSettings,help:renderHelp,onboarding:renderOnboarding,detail:renderDetail,reader:renderReader,importing:renderImporting,empty:renderEmpty,error:renderError,export:renderExport,bulk:renderBulk};document.querySelector("#screen").innerHTML=(views[route]||renderHome)();wire()}
function wire(){document.querySelectorAll("[data-route]").forEach(b=>b.onclick=()=>go(b.dataset.route));document.querySelectorAll("[data-detail]").forEach(b=>b.onclick=()=>{activeResource=Number(b.dataset.detail);go("detail")});document.querySelectorAll("[data-query]").forEach(b=>b.onclick=()=>{searchTerm=b.dataset.query;go("search");setTimeout(()=>{const i=document.querySelector("#mainSearch");if(i){i.value=searchTerm;runSearch()}},0)});const ls=document.querySelector("#libFilter");if(ls){ls.oninput=()=>filterLibrary();document.querySelector("#clearFilter").onclick=()=>{ls.value="";filterLibrary()};document.querySelectorAll("[data-libtab]").forEach(b=>b.onclick=()=>{collectionTab=b.dataset.libtab;document.querySelectorAll("[data-libtab]").forEach(x=>x.classList.toggle("active",x===b));filterLibrary()});document.querySelector("#sortBtn").onclick=()=>toast("Sort options: recently saved, title, source, type (concept interaction).");document.querySelector("#libraryView").onchange=e=>{document.querySelector("#libResults").style.opacity=".85";toast(e.target.value+" selected for review")}}
const ms=document.querySelector("#mainSearch");if(ms){ms.onkeydown=e=>{if(e.key==="Enter")runSearch()};document.querySelector("#runSearch").onclick=runSearch}
document.querySelectorAll("[data-boardmode]").forEach(b=>b.onclick=()=>{boardMode=b.dataset.boardmode;render()});document.querySelectorAll("[data-graphmode]").forEach(b=>b.onclick=()=>{graphMode=b.dataset.graphmode;render()});document.querySelectorAll("[data-rstep]").forEach(b=>b.onclick=()=>{researchStep=Number(b.dataset.rstep);render()});document.querySelectorAll("[data-inbox]").forEach(b=>b.onclick=()=>{inboxFilter=b.dataset.inbox;render()});document.querySelectorAll("[data-capturetype]").forEach(b=>b.onclick=()=>{captureType=b.dataset.capturetype;render()});
const cf=document.querySelector("#captureForm");if(cf)cf.onsubmit=e=>{e.preventDefault();const val=document.querySelector("#captureTitle").value.trim();if(!val)return;R.unshift({id:Math.max(...R.map(r=>r.id))+1,title:val,kind:captureType.toUpperCase(),source:"Quick capture",desc:document.querySelector("#captureNote").value||"New local demo capture.",color:"#cfdfcf",icon:"✎",group:"Inbox"});toast("Added to the local demo inbox.");go("inbox")};
const n=document.querySelector("#newCollection");if(n)n.onclick=()=>{const x=prompt("Collection name");if(x)toast('Collection "'+x+'" created in the prototype only.')};const nb=document.querySelector("#newBoard");if(nb)nb.onclick=()=>toast("New board created in the prototype (not persisted).");
const add=document.querySelector("#addBoardCard");if(add)add.onclick=()=>{const b=document.querySelector("#board"),n=document.createElement("article");n.className="boardnode";n.tabIndex=0;n.style.left=(15+Math.random()*55)+"%";n.style.top=(10+Math.random()*65)+"%";n.innerHTML="<small>NEW NOTE</small><b>Untitled thought</b><span class='muted'>Local demo card</span>";b.appendChild(n);document.querySelector("#boardStatus").textContent=b.querySelectorAll(".boardnode").length+" cards · local prototype"};
const cb=document.querySelector("#connectBoard");if(cb)cb.onclick=()=>toast("Connection mode: select two cards. Full connector editing is not implemented.");const bh=document.querySelector("#boardHelp");if(bh)bh.onclick=()=>toast("Keyboard: Tab to focus cards; Enter to open. Dragging is not implemented in this mock.");
document.querySelectorAll("[data-open-collection]").forEach(b=>b.onclick=()=>{toast("Collection opened in this concept.");go("library")});document.querySelectorAll("[data-integration]").forEach(b=>b.onclick=()=>toast(b.dataset.integration+": connection details, scopes, and disconnect controls would appear here."));
document.querySelectorAll("[data-capturetype]").forEach(()=>{});const rq=document.querySelector("#researchQuestion");if(rq)rq.onchange=()=>toast("Question edited locally.");const sq=document.querySelector("#saveQuestion");if(sq)sq.onclick=()=>toast("Question saved in this local prototype.");const ar=document.querySelector("#addResearchSource");if(ar)ar.onclick=()=>toast("Source picker is not connected.");const ic=document.querySelector("#inspectClaim");if(ic)ic.onclick=()=>toast("Claim inspector: passage and source verification would open.");const ce=document.querySelector("#counterEvidence");if(ce)ce.onclick=()=>toast("Counterevidence search is not connected.");const es=document.querySelector("#exportSynthesis");if(es)es.onclick=()=>toast("Draft export is illustrative only.");const mr=document.querySelector("#markReview");if(mr)mr.onclick=()=>toast("Marked for review in this local demo.");
const fav=document.querySelector("#favorite");if(fav)fav.onclick=()=>toast("Saved for later (not persisted).");const sm=document.querySelector("#saveAnnotation");if(sm)sm.onclick=()=>toast("Annotation saved locally for this view.");const dm=document.querySelector("#detailMore");if(dm)dm.onclick=()=>toast("More actions: move, duplicate reference, archive, export, report issue.");const rf=document.querySelector("#readerFont");if(rf)rf.onclick=()=>{const p=document.querySelector(".reader");p.style.fontSize=p.style.fontSize==="20px"?"18px":"20px"};const ff=document.querySelector("#readerFocus");if(ff)ff.onclick=()=>{document.querySelector(".split aside").classList.toggle("hide-mobile");toast("Focus reading layout toggled.")};const hl=document.querySelector("#highlight");if(hl)hl.onclick=()=>toast("Select text in a real reader to create a source-linked highlight.");const rn=document.querySelector("#readerNote");if(rn)rn.onclick=()=>toast("Annotation editor would open.");
const ri=document.querySelector("#retryImport");if(ri)ri.onclick=()=>toast("Retry queued in this demo; no actual import runs.");const re=document.querySelector("#retryError");if(re)re.onclick=()=>toast("Retry is illustrative; original reference remains available.");const mi=document.querySelector("#manualImport");if(mi)mi.onclick=()=>go("capture");const od=document.querySelector("#offlineDemo");if(od)od.onclick=()=>toast("Connection restored. Pending changes would now sync.");const dd=document.querySelector("#deleteDemo");if(dd)dd.onclick=()=>confirm("Preview only: would show selected items and recovery period before deleting.")&&toast("No resources deleted in this preview.");const ld=document.querySelector("#loadingDemo");if(ld)ld.onclick=()=>toast("Loading preview: skeleton, preserved filters, and cancel action.");document.querySelectorAll("[data-recovery]").forEach(b=>b.onclick=()=>toast("Recovery steps for "+b.dataset.recovery+" would appear here."));
const st=document.querySelector("#settingsTheme");if(st)st.onclick=toggleTheme;const den=document.querySelector("#density");if(den)den.onclick=()=>toast("Density preference preview: comfortable / compact.");const aip=document.querySelector("#aiPrivacy");if(aip)aip.onclick=()=>toast("Review processing scope, providers, retention, and opt-out controls.");const ret=document.querySelector("#retention");if(ret)ret.onclick=()=>toast("Retention and deletion controls would open.");const ac=document.querySelector("#account");if(ac)ac.onclick=()=>toast("Account controls are not connected.");const ses=document.querySelector("#sessions");if(ses)ses.onclick=()=>toast("Session management is not connected.");const ref=document.querySelector("#reflect");if(ref)ref.onclick=()=>{const x=prompt("What did you apply or learn?");if(x)toast("Reflection drafted locally.")};const gam=document.querySelector("#gamify");if(gam)gam.onclick=()=>go("settings");const ai=document.querySelector("#addSource");if(ai)ai.onclick=()=>toast("Source import not connected.");
const sqb=document.querySelector("#startExport");if(sqb)sqb.onclick=()=>toast("Export prepared conceptually. No archive is created by this mock.");const bl=document.querySelectorAll("[data-bulk]");if(bl.length)bl.forEach(x=>x.onchange=()=>document.querySelector("#bulkCount").textContent=document.querySelectorAll("[data-bulk]:checked").length+" selected");const bc=document.querySelector("#bulkCollection");if(bc)bc.onclick=()=>toast("Selected resources would be added to a chosen collection.");const be=document.querySelector("#bulkExport");if(be)be.onclick=()=>toast("Selected-resource export is not implemented.");const bd=document.querySelector("#bulkDelete");if(bd)bd.onclick=()=>confirm("Preview only: confirm deletion of selected resources?")&&toast("No resources deleted in this preview.");
const cr=document.querySelector("#confirmEdge");if(cr)cr.onclick=()=>toast("Review proposed relationship: confirm, edit, or reject.");const nr=document.querySelector("#newResearch");if(nr)nr.onclick=()=>toast("New investigation draft created in this local mock.");const sr=document.querySelector("#saveDossier");if(sr)sr.onclick=()=>toast("Dossier not persisted.");}
function filterLibrary(){const q=(document.querySelector("#libFilter")?.value||"").toLowerCase(),tab=collectionTab;const arr=R.filter(r=>(r.title+" "+r.source+" "+r.desc+" "+r.kind).toLowerCase().includes(q)&&(tab==="All items"||(tab==="Articles"&&r.kind==="ARTICLE")||(tab==="Videos"&&r.kind==="VIDEO")||(tab==="Courses"&&r.kind==="COURSE")||(tab==="Notes"&&r.kind==="NOTE")||(tab==="GitHub"&&r.kind==="GITHUB")||(tab==="PDFs"&&r.kind==="PDF")));document.querySelector("#libResults").innerHTML=arr.length?resourcesGrid(arr):'<div class="empty"><div class="symbol">⌕</div><h3>No resources match</h3><p class="muted">Clear the filter or try a broader phrase.</p><button id="emptyClear">Clear filters</button></div>';document.querySelector("#libCount").textContent=arr.length+" resources · filtered locally";document.querySelectorAll("[data-detail]").forEach(b=>b.onclick=()=>{activeResource=Number(b.dataset.detail);go("detail")});const ec=document.querySelector("#emptyClear");if(ec)ec.onclick=()=>{document.querySelector("#libFilter").value="";collectionTab="All items";render()}}
function runSearch(){searchTerm=document.querySelector("#mainSearch").value.trim();const arr=R.filter(r=>(r.title+" "+r.desc+" "+r.source+" "+r.kind+" "+r.group).toLowerCase().includes(searchTerm.toLowerCase()));const el=document.querySelector("#searchResults");el.innerHTML='<div class="subhead"><h2>'+(arr.length?arr.length+" possible matches":"No text matches")+'</h2><span class="muted">Local keyword matching · not semantic search</span></div>'+(arr.length?resourcesGrid(arr):'<div class="empty"><div class="symbol">⌕</div><h3>Nothing matched that wording</h3><p class="muted">Try a broader phrase, remove filters, or browse your library. No resource has been deleted.</p><button data-route="library">Browse all resources</button></div>');wire()}
function toggleTheme(){theme=theme==="light"?"dark":"light";document.querySelector("#app").setAttribute("data-theme",theme);toast(theme==="dark"?"Dark mode":"Light mode")}
document.querySelectorAll("[data-route]").forEach(b=>b.onclick=()=>go(b.dataset.route));document.querySelector("#menu").onclick=()=>document.querySelector("#sidebar").classList.toggle("open");document.querySelector("#themeBtn").onclick=toggleTheme;document.querySelector("#settingsTheme").onclick=toggleTheme;document.querySelector("#globalSearch").onclick=()=>go("search");document.querySelector("#screenIndex").onclick=()=>go("screenindex");document.querySelector("#topCapture").onclick=()=>go("capture");go("home");
</script></body></html>
